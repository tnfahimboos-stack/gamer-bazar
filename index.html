
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamer Bazar - Recharge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#f47716;font-family:Arial,sans-serif;padding:16px;padding-bottom:85px}
h2{font-size:22px;margin:8px 0 5px}
.sub{color:#888;font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.item{border:1px solid #f5d9c4;border-radius:12px;padding:13px 9px;background:#fff;box-shadow:0 2px 6px #f5eee9;display:flex;align-items:center;gap:9px;min-height:76px}
.diamond{font-size:24px}
.info{flex:1;min-width:0}
.name{font-weight:bold;color:#333;font-size:13px}
.price{color:#f47716;font-weight:bold;font-size:13px;margin-top:6px}
.item button{background:#fff1e5;color:#f47716;border:1px solid #ffb477;border-radius:7px;padding:6px 8px;font-size:11px;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;width:100%;background:white;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:12px 3px}
.bottom span{text-align:center;font-size:12px;color:#f47716}
.bottom b{display:block;font-size:21px;margin-bottom:3px}
</style>
</head>
<body>

<h2>💎 Select Recharge</h2>
<div class="sub">Select your diamond package</div>

<div class="grid" id="list"></div>

<div class="bottom">
<span><b>⌂</b>Home</span>
<span><b>▣</b>Add Money</span>
<span><b>▤</b>Orders</span>
</div>

<script>
const packs=[
["25 Diamonds","20 TK"],["50 Diamonds","35 TK"],
["100 Diamonds","75 TK"],["115 Diamonds","79 TK"],
["240 Diamonds","158 TK"],["355 Diamonds","237 TK"],
["480 Diamonds","316 TK"],["505 Diamonds","336 TK"],
["610 Diamonds","400 TK"],["725 Diamonds","479 TK"],
["850 Diamonds","558 TK"],["1015 Diamonds","680 TK"],
["1240 Diamonds","800 TK"],["1850 Diamonds","1200 TK"],
["2530 Diamonds","1610 TK"],["5060 Diamonds","3220 TK"],
["10120 Diamonds","6440 TK"],
["Monthly Membership","790 TK"],
["Weekly Membership","158 TK"],["Weekly Lite","40 TK"]
];

document.getElementById("list").innerHTML=packs.map(p=>`
<div class="item">
 <div class="diamond">💎</div>
 <div class="info">
  <div class="name">${p[0]}</div>
  <div class="price">${p[1]}</div>
 </div>
 <button onclick="selectPack('${p[0]}','${p[1]}')">SELECT</button>
</div>`).join("");

function selectPack(name,price){
 alert("Selected: "+name+"\nPrice: "+price+"\nএটি শুধু ডেমো।");
}
</script>
</body>
</html>
